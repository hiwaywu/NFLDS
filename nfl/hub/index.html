// The site's player may hand its media window to window.open(). A sandboxed frame
// cannot create one, so the patch inside every proxied page posts the URL here and
// the picture goes in the same frame.
//
// The gate matters more than the feature: an ad calls window.open() far more often
// than a player does, and "load whatever asked" is how the whole window ended up on
// an ad landing page. A popup is only honoured when it names a player: same site as
// the page being proxied, a host this session has already proxied, or a URL whose
// path says /main/, /embed, /player, /secure/ or a manifest.
const AD_HOST_RX = /(doubleclick|googlesyndication|adservice|google-analytics|adsterra|popads|popcash|propellerads|onclicksuper|onclickalgo|clickadu|hilltopads|exoclick|tsyndicate|juicyads|trafficjunky|revcontent|taboola|outbrain|mgid|zedo|profitablerate|adnium|galaksion|adspyglass|ad-maven|adcash|dtscdn|dtscout|mrktmtrcs|trend48|zedo)/i;
const pfKnownHosts = new Set();
function hostOf(u){ try { return new URL(u).hostname.toLowerCase(); } catch(e){ return ''; } }
function regDomain(h){ const p = (h||'').split('.'); return p.length >= 2 ? p.slice(-2).join('.') : (h||''); }

  try {
    const src = ($('#pf') || {}).getAttribute ? ($('#pf').getAttribute('src') || '') : '';
    const m = /[?&]u=([^&]+)/.exec(src);
    return m ? decodeURIComponent(m[1]) : '';

function popupAllowed(u){
  if (!u || !/^https?:\/\//i.test(u)) return false;

  if (!host) return false;
  const cur = hostOf(pfUpstream() || (lastGame && lastGame.url) || '');
  if (cur && (host === cur || regDomain(host) === regDomain(cur))) return true;
  if (pfKnownHosts.has(host)) return true;

}
window.addEventListener('message', function(ev){
  const d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.nfl_wake){ fsUiWake(); return; }        // a touch landed inside the player frame
  if (!d.nfl_popup) return;
  const u = String(d.nfl_popup);
  if (!popupAllowed(u)){
    toast('an ad asked for a window - dropped', 2200);
    return;
  }

         '&r=' + encodeURIComponent(d.nfl_ref || '') + '&_=' + Date.now());

});

async function watchGame(g, useFrame){
  lastGame = g;
  setSpin(true, 'finding the feed that actually plays...');
  $('#nowTitle').textContent = g.name;
  $('#pillQ').style.display = 'none';
  $('#pillBuf').style.display = 'none';

  // Same walk as the phone, now on the PC too: try the plain-GET chain first -- no
  // page JS, so no ad layer loads -- and play the manifest it names in our own
  // <video> through the relay. A feed that is Widevine-packaged but ships its clear
  // key in the open plays as well; only a real Widevine feed (no published key)
  // falls through to the site's player page.
  if (!STANDALONE && !IS_MOBILE){
    try {
      const hr = await fetch('/api/harvest?u=' + encodeURIComponent(g.url));
      if (hr.ok){
        const h = await hr.json();
        const keys = (h && h.keys && Object.keys(h.keys).length) ? h.keys : null;
        if (h && h.ok && h.m3u8 && (!h.drm || keys)){
          if (hls){ try { hls.destroy(); } catch(e){} hls = null; }
          lastChannel = null;
          gameNow = g;      // a dead game feed hops this game's links, never NFL TV
          document.body.classList.remove('iframeMode');
          toast(keys ? 'harvested the feed and its published key - playing here'
                     : 'harvested the feed - playing it here, no player page, no ads', 3000);
          // A harvested manifest that will not start must not cost the game: fall
          // through to the site's player page instead of dying on the spinner.
          try {
            await playChannel({ name: g.name, url: h.m3u8, referer: h.referer }, false, keys, true);
            return;
          } catch(e){
            toast('that feed would not start - falling back to the player page', 3600);
            document.body.classList.remove('iframeMode');
          }
        }
        if (h && h.drm && !keys)
          toast('this mirror is Widevine with no published key - using the player page', 3200);
      }
    } catch(e){}
  }

  // The phone cannot play these feeds inside this page: they are Widevine and
  // EME refuses a non-secure origin (http://192.168.x.x is not one), so the
  // in-page iframe stays black. A top-level navigation to the https player is
  // a secure context and the only path that can decrypt on a phone.
  if (IS_MOBILE){
    // ---- resolve to the actual stream, not to the page that plays it ----
    // The "Main N" page is wrapper after wrapper until one of them names the
    // manifest (and usually leaks the clear-key pair alongside it). The walk
    // happens here, one plain GET at a time through the app: when a wrapper's
    // host 403s the plain fetch (Cloudflare fingerprints JVM TLS), the app
    // renders that single page inside its invisible engine and hands back
    // only the rendered text. No JS from any of these hosts runs on the
    // visible screen, so the ad layers never reach the user.
    if (STANDALONE){
      setSpin(true, 'resolving the stream link directly...');
      $('#nowTitle').textContent = g.name;
      // every link of the event page, ranked by the ladder it advertises -- the
      // first link that plays is regularly the 720p one (see harvestRanked)
      let ranked = [];
      try { ranked = await harvestRanked(g, useFrame ? [useFrame] : null); }
      catch(e){ toast('ranking the links failed (' + e.message + ') - using the old walk', 3000); }
      if (!ranked.length){
        try {
          const one = await harvestChain(g, useFrame ? [useFrame] : null);
          if (one && one.m3u8) ranked = [Object.assign({ frame: g.url }, one)];
        } catch(e){}
      }
      // the link that measured best on this game before goes first
      const remembered = pickCache[g.url];
      if (remembered && remembered.m3u8){
        const at = ranked.findIndex(c => c.m3u8 === remembered.m3u8);
        if (at > 0){ const [x] = ranked.splice(at, 1); ranked.unshift(x); }
      }
      let h = ranked[0] || null;
      // The plain-GET walk stops at a chain built in JavaScript. Those pages are
      // rendered by the app's invisible engine instead -- no screen, no popups,
      // ad hosts blocked -- and only the media playlist it asks for comes back.
      if (!(h && h.m3u8)){
        let jr = null;
        try { jr = await fetch('/api/resolve?u=' + encodeURIComponent(g.url)).then(r => r.json()); } catch(e){}
        const cand = [];
        if (jr && jr.browser) cand.push(jr.browser);
        if (jr && jr.open && cand.indexOf(jr.open) < 0) cand.push(jr.open);
        if (g.url && cand.indexOf(g.url) < 0) cand.push(g.url);
        for (let i = 0; i < cand.length && i < 3; i++){
          setSpin(true, 'reading the player page for its stream...');
          const s = await sniffStream(cand[i], cand[i] === g.url ? '' : g.url);
          if (s && s.m3u8){ s.frame = cand[i]; h = s; ranked = [s]; toast('stream found - playing it in the app, no page', 3000); break; }
        }
      }
      if (h && h.m3u8){
          if (hls){ try { hls.destroy(); } catch(e){} hls = null; }
          lastChannel = { name: g.name, url: h.m3u8 };   // the failover pool belongs to this game now
          gameNow = g;
          mirrorTried.clear(); mirrorReason = '';
          document.body.classList.remove('iframeMode');
          const srcPill = $('#pillSrc');
          if (srcPill){
            srcPill.textContent = 'direct feed - no ads' + (h.via ? ' \u00b7 via ' + h.via : '');
            srcPill.className = 'pill good'; srcPill.style.display = '';
          }
          toast('direct feed resolved - playing in-app', 3000);
          // shaka handles the clearkey-encrypted HLS the way the provider's own
          // player does; it reads the relay, so nothing is cross-origin.
          // If that feed will not start, the player page is still one tap away --
          // do not leave the viewer on a spinner.
          try {
            await playChannel({ name: g.name, url: h.m3u8, referer: h.referer },
                              false, h.keys, true,
                              !!(h.keys && typeof shaka !== 'undefined'));
            // the decoder is the final judge: a "1080p" rung that decodes at 720p
            // must lose to a link that really is 1080p. The hunt runs now, not before
            // playback: the picture is already on screen, so a sniff costs nothing.
            let playing = Object.assign({}, h, { measuredH: v.videoHeight || 0 });
            if (!v.videoHeight || v.videoHeight < 1080){
              // The hunt is behind this switch because it is not honest yet: the mirror's
              // `/main/secure/..._1080p.m3u8` ranks top (real 1920x1080, clear HLS, verified
              // with a decoder) but handing it to the relay starts nothing -- the relay's
              // own fetch of that CDN is the missing piece, and an auto-switch to a stream
              // the relay cannot pull leaves a black picture. Turn it on when the relay can.
              if (SHARP_HUNT){ try {
                ranked = await huntSharp(g, ranked, playing, ranked.links || null);
                playing = (await upgradeQuality(g, ranked, playing, ranked.links || null)) || playing;
              } catch(e){} }
            }
            startLiveGuard(g, (playing && playing.frame) || h.frame || null, playing || h);
            setSpin(false);
            return;
          } catch(e){
            toast('that feed would not start - falling back to the player page', 3600);
            document.body.classList.remove('iframeMode');
          }
      }
      // Nothing resolved. Do NOT dump the user into the ad-filled site: offer
      // the two honest choices and stay on our own page.
      setSpin(false);
      showResolveFailed(g);
      return;
    }
    let j = null;
    try { j = await fetch('/api/resolve?u=' + encodeURIComponent(g.url)).then(r => r.json()); } catch(e){}
    setSpin(false);
    // A phone's WebView can decrypt these feeds only when it has a Widevine key
    // system; know that before promising a picture, instead of showing a black
    // rectangle and leaving the browser chip as the only way out.
    if (await drmState(2000) === false)
      toast('this webview reports no Widevine key system - if it stays black, the browser chip plays it', 6500);
    // standalone: the "Main N" page itself, which embeds its player the way the
    // player host allows; the frame alone refuses to play outside its own sites
    const target = (j && (STANDALONE ? (j.browser || j.open) : (j.open || j.frame))) || g.url;
    if (!j || !j.ok){
      // one tap should produce the picture, not a question. The probe can only
      // check a feed that is already playing; before tip-off every mirror says
      // "not yet", so asking here just adds a click between you and the page.
      toast('opening the stream page in the app', 2400);
    } else if (g.state !== 'in'){
      toast('not kickoff yet \u2014 the page has the stream at ' + (g.time || 'game time'), 4200);
    }
    $('#nowTitle').textContent = g.name + '  \u2014  opening player';
    hideUnmute();
    // Widevine cannot be decrypted by a webview without EME; Chrome on the same
    // phone can. Hand the link over instead of showing a black rectangle.
    if (STANDALONE && Hub.openInternal){
      if (hls){ hls.destroy(); hls = null; }      // one stream at a time on mobile data
      try { v.pause(); } catch(e){}
      toast('opening the game player \u2014 \u2302 or Back returns here', 3200);
      Hub.openInternal(target);
      return;
    }
    // the PC-hub app (1.x) on an http://192.168.x.x origin has no EME at all
    if (IN_APP && window.Hub && Hub.openExternal){
      toast('opening the game in your browser', 3200);
      Hub.openExternal(target);
      return;
    }
    if (window.Hub && Hub.openInternal) Hub.openInternal(target);
    else location.href = target;
    return;
  }

  try {
    const j = await fetch('/api/resolve?u=' + encodeURIComponent(g.url)).then(r => r.json());
    const target = j.open || j.frame;
    if (!(j && j.ok && target)) { toast('no working feed found for this game right now', 4500); setSpin(false); return; }
    if (await drmState(2500) === false)
      toast('this browser has no Widevine key system - the picture will stay black', 6000);
    pfKnownHosts.add(hostOf(g.url));
    pfKnownHosts.add(hostOf(target));
    const pf = $('#pf');
    if (hls){ hls.destroy(); hls = null; }
    document.body.classList.remove('playing');
    document.body.classList.add('iframeMode');
    pf.style.display = 'block';
    // r=<event page>: the Referer the upstream player expects. The hub makes the
    // request itself, so this is the identity it leaves with -- and the window
    // never has to hand the game off to a browser.
    pfOpen('/play?u=' + encodeURIComponent(target) +
           '&r=' + encodeURIComponent(g.url) + '&_=' + Date.now());
    const srcPill = $('#pillSrc');
    if (srcPill){
      let h = ''; try { h = new URL(target).hostname; } catch(e){}
      srcPill.textContent = 'site player - ' + (h || 'external') + (h.indexOf('akamaized') >= 0 || h.indexOf('nfl') >= 0 ? '  (Game Pass)' : '');
      srcPill.className = 'pill'; srcPill.style.display = '';
    }
    $('#reloadStream').style.display = 'block';
    polReset(g, (j.probe || {}).h || 0);
    const st = j.probe || {};
    if (st.w){ $('#pillQ').textContent = st.w + 'x' + st.h + ' \u00b7 playing'; $('#pillQ').className='pill good'; $('#pillQ').style.display=''; }
    toast('feed found - ' + (st.h ? st.h + 'p' : 'live'), 3000);
  } catch(e){ toast('could not open that game', 4000); }
  setSpin(false);
}

function fsTarget(){
  return document.body.classList.contains('iframeMode') ? $('#pf') : v;
}
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            (v && v.webkitDisplayingFullscreen));
}
function exitFullscreen(){
  if (document.exitFullscreen) { document.exitFullscreen().catch(() => {}); return; }
  if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); return; }
  if (v && v.webkitExitFullscreen) v.webkitExitFullscreen();
  tellAppFullscreen(false);
}
// In the app, fullscreen also means landscape: the WebView cannot rotate itself,
// so hand the decision to MainActivity (Hub.setFullscreen) on every change.
function tellAppFullscreen(on){
  try { if (window.Hub && Hub.setFullscreen) Hub.setFullscreen(!!on); } catch(e){}
  // the app's own fullscreen (landscape, no system bars) is not the Fullscreen API,
  // so the page has to remember it itself -- otherwise the chrome never fades there
  document.body.classList.toggle('appfs', !!on);
  if (on) fsUiWake(); else fsUiReset();
}
$('#fs').onclick = () => {
  tellAppFullscreen(true); if (isFullscreen()){ exitFullscreen(); return; }
  // Fullscreen the *container*, never the raw video: our CSS then owns the
  // geometry (object-fit:contain => letterbox), on desktop and in a WebView
  // alike. The old Android path called video.webkitEnterFullscreen(), which
  // hands the picture to the platform's native player -- that one ignores
  // object-fit and stretched a 16:9 stream on a 16:10 screen.
  const el = fsTarget();
  const target = (el.tagName === 'VIDEO' && stage) ? stage : el;
  if (target.requestFullscreen){
    target.requestFullscreen().catch(() => toast('fullscreen was blocked - maximise the window instead', 2600));
    return;
  }
  if (target.webkitRequestFullscreen){ target.webkitRequestFullscreen(); return; }
  if (el.tagName === 'VIDEO' && el.webkitEnterFullscreen){    // last resort (iOS)
    try { el.webkitEnterFullscreen(); } catch(e){ toast('fullscreen was blocked here', 2200); }
    return;
  }
  toast('fullscreen is not available here', 2200);
};

// ---- fullscreen chrome that gets out of the way -------------------------
// Two exits are in play on a phone: the Fullscreen API (which the WebView renders
// through onShowCustomView) and the app's own "landscape + no system bars" mode
// (Hub.setFullscreen). Both count as fullscreen here, so the same rule holds
// whichever one you landed in: nothing on screen but the picture, unless you touch.
function fsActive(){
  return isFullscreen() || document.body.classList.contains('appfs');
}
let fsIdle = null;
function fsUiWake(){
  document.body.classList.remove('fsfade');
  if (fsIdle) clearTimeout(fsIdle);
  fsIdle = null;
  if (!fsActive()) return;
  fsIdle = setTimeout(function(){
    // the platform's progress bar is the other thing that never leaves
    if (IS_MOBILE) { try { v.controls = false; } catch(e){} }
    document.body.classList.add('fsfade');
  }, 2600);
}
function fsUiReset(){
  if (fsIdle) clearTimeout(fsIdle);
  fsIdle = null;
  document.body.classList.remove('fsfade');
  try { v.controls = true; } catch(e){}
}
['pointerdown','pointermove','touchstart','keydown','wheel'].forEach(function(ev){
  document.addEventListener(ev, function(){ if (fsActive()) fsUiWake(); }, { passive: true });
});
// keep the button label honest whichever way fullscreen ends (Esc included)

    const b = $('#fs');

    tellAppFullscreen(isFullscreen());

  });
});

function browserName(){
  const ua = navigator.userAgent;
  const v = re => { const m = ua.match(re); return m ? m[1] : ''; };
  if (/Edg\//.test(ua)) return 'Edge ' + v(/Edg\/([\d.]+)/);
  if (/OPR\//.test(ua)) return 'Opera ' + v(/OPR\/([\d.]+)/);
  if (/Firefox\//.test(ua)) return 'Firefox ' + v(/Firefox\/([\d.]+)/);
  // no \b: "HeadlessChrome/156" must count as Chrome too
  if (/Chrome\//.test(ua)){
    const ver = v(/Chrome\/([\d.]+)/);
    return IN_APP ? 'Android app (Chrome WebView ' + ver + ')' : 'Chrome ' + ver;
  }
  if (/Safari\//.test(ua)) return 'Safari ' + v(/Version\/([\d.]+)/);
  return ua;
}

// ---------- diagnostics (long-press the title) ----------
async function diag(){
  const rows = [];
  const add = (k, val) => rows.push([k, String(val)]);
  add('window', browserName());
  add('page', location.href);
  add('user agent', navigator.userAgent);
  add('secure context', window.isSecureContext === undefined ? '?' : window.isSecureContext);
  add('mobile / in app', IS_MOBILE + ' / ' + IN_APP);
  add('hls.js', window.Hls ? (Hls.version || 'loaded') : 'MISSING');
  add('MSE', !!(window.MediaSource));
  add('device', (navigator.hardwareConcurrency || '?') + ' cores, dpr ' + (window.devicePixelRatio||1));
  let drm = 'checking...';
  try {
    if (!navigator.requestMediaKeySystemAccess) drm = 'no EME in this webview';
    else {
      const cfg = [{
        initDataTypes: ['cenc'],
        videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.42E01E"',
                              robustness: 'SW_SECURE_CRYPTO' }]
      }];
      const acc = await navigator.requestMediaKeySystemAccess('com.widevine.alpha', cfg);
      let keys = '?';
      try { await acc.createMediaKeys(); keys = 'ok'; } catch(e){ keys = 'createMediaKeys: ' + e.message; }
      drm = acc.keySystem + ' level available, keys ' + keys;
    }
  } catch(e){ drm = 'Widevine unavailable: ' + (e && e.message || e); }
  add('widevine', drm);
  add('relay', relayBase || '(none started)');
  add('now playing', $('#nowTitle').textContent);
  try {
    const p = await fetch('/api/ping?_=' + Date.now()).then(r => r.json());
    add('hub', JSON.stringify(p));
  } catch(e){ add('hub', 'unreachable: ' + e.message); }
  if (hls && hls.levels && hls.levels.length){
    add('levels', hls.levels.map(l => (l.width||'?') + 'x' + (l.height||'?') + '@' + Math.round((l.bitrate||0)/1000) + 'k').join(', '));
  }
  if (hls){
    try {
      add('latency', (typeof hls.latency === 'number' ? hls.latency.toFixed(2) : '?') + ' s behind live');
      add('buffer', 'hls ' + (hls.mainForwardBufferInfo ? hls.mainForwardBufferInfo().len.toFixed(1) : '?') + ' s ahead');
      add('stalls', stallCount + ' (video waiting events since page load)');
      add('mirror', (mirrorIdx + 1) + '/' + channels.length +
          '  tried ' + mirrorTried.size + (mirrorReason ? '  last fail: ' + mirrorReason : ''));
      add('delay target', (lowMode ? DELAY.low : DELAY.normal) + ' x ' + hls.targetLatency + 's');
    } catch(e){ add('hls stats', String(e)); }
  }
  if (v && v.currentTime !== undefined){
    add('video', 'readyState ' + v.readyState + ' / t ' + (Math.round(v.currentTime*10)/10) + 's / ' +
        (v.videoWidth||0) + 'x' + (v.videoHeight||0) + ' / muted ' + v.muted + ' / paused ' + v.paused);
  }
  const body = document.getElementById('diagBody');
  body.innerHTML = '<h2>diagnostics</h2><table>' +
    rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table>';
  document.getElementById('diag').classList.add('show');
}

async function boot(){
  curDate = todayISO();
  try {
    const saved = localStorage.getItem(DATE_KEY);
    if (saved && /^\d{4}-\d{2}-\d{2}$/.test(saved)) curDate = saved;
  } catch(e){}
  try {
    const [ch, dt] = await Promise.all([
      fetch('/api/channels?_=' + Date.now()).then(r => r.json()).catch(() => ({channels: []})),
      fetch('/api/dates?_=' + Date.now()).then(r => r.json()).catch(() => ({dates: []}))
    ]);
    channels = ch.channels || [];
    dates = dt.dates || [];
    if (dt.season && dt.season.start && dt.season.end) season = dt.season;
  } catch(e){ channels = []; dates = []; }

  let today = { games: [] };
  try {
    today = await fetch('/api/games?date=' + curDate + '&_=' + Date.now()).then(r => r.json());
  } catch(e){}

  // only auto-advance when the user has not picked a date themselves
  if (!(today.games || []).length && curDate === todayISO()){
    const next = dates.find(d => d > curDate) || dates[dates.length - 1];
    const n = $('#note');
    if (next){
      curDate = next;
      n.className = 'show';
      n.textContent = 'No NFL games listed today. Showing the next slate: ' + labelFor(next).sub + '.';
    } else {
      n.className = 'show';
      n.textContent = 'No NFL games listed right now. NFL TV below is always on.';
    }
  }
  await loadGames();

  // deep link: /?chan=0 plays the Nth NFL TV channel straight away
  const qp = new URLSearchParams(location.search);
  if (qp.has('chan')){
    const i = parseInt(qp.get('chan'), 10);
    if (!isNaN(i) && channels[i]) playChannel(channels[i]);
  }
  // deep link: /?game=<event page> runs the real game path on that page -- the
  // harvest walk, the relay, the picture. It exists so the app can be pointed at a
  // fixture chain without going through the schedule.
  if (qp.has('game')){
    const gu = qp.get('game');
    if (/^https?:\/\//i.test(gu || ''))
      watchGame({ name: 'deep link game', url: gu, state: 'in', time: 'now' });
  }
  if (IN_APP && window.Hub && Hub.hubReady) Hub.hubReady();
}

// PC keyboard: f fullscreen, m mute, r reload the feed, Esc exits fullscreen
addEventListener('keydown', function(e){
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const k = (e.key || '').toLowerCase();
  if (k === 'f'){ e.preventDefault(); $('#fs').click(); }
  else if (k === 'm'){ e.preventDefault(); v.muted = !v.muted; hideUnmute(); toast(v.muted ? 'muted' : 'sound on', 1400); }
  else if (k === 'r' && lastChannel){ e.preventDefault(); playChannel(lastChannel); }
});

// ---------- Fire TV / Android TV: a TV interface ----------
// The TV build answers Hub.tv() === true (?tv=1 turns it on in a desktop browser

// Browse screen: a date bar, then rows of cards (tonight's games, NFL TV).

const TV = (IN_APP && !!(window.Hub && Hub.tv && Hub.tv())) ||

  const TEAMS = [

    ['cowboys','DAL','#041E42','dal','Cowboys'],['broncos','DEN','#FB4F14','den','Broncos'],
    ['lions','DET','#0076B6','det','Lions'],['packers','GB','#203731','gb','Packers'],
    ['texans','HOU','#03202F','hou','Texans'],['colts','IND','#002C5F','ind','Colts'],
    ['jaguars','JAX','#006778','jax','Jaguars'],['chiefs','KC','#E31837','kc','Chiefs'],
    ['raiders','LV','#A5ACAF','lv','Raiders'],['chargers','LAC','#0080C6','lac','Chargers'],
    ['rams','LAR','#003594','lar','Rams'],['dolphins','MIA','#008E97','mia','Dolphins'],
    ['vikings','MIN','#4F2683','min','Vikings'],['patriots','NE','#002244','ne','Patriots'],
    ['saints','NO','#D3BC8D','no','Saints'],['giants','NYG','#0B2265','nyg','Giants'],
    ['jets','NYJ','#125740','nyj','Jets'],['eagles','PHI','#004C54','phi','Eagles'],
    ['steelers','PIT','#FFB612','pit','Steelers'],['49ers','SF','#AA0000','sf','49ers'],

    ['titans','TEN','#0C2340','ten','Titans'],['commanders','WAS','#5A1414','was','Commanders']
  ];
  function team(n){
    const low = (n || '').toLowerCase();
    for (const t of TEAMS) if (low.indexOf(t[0]) >= 0)
      return { ab: t[1], col: t[2], nick: t[4], name: (n || '').trim(),

  // a logo that does not load becomes the coloured badge it would have been

      '<div id="tvHead"><div id="tvBrand"><i></i>NFL Hub</div>' +
        '<div id="tvDate"><button class="tvbtn arrow" data-act="prev">&#8249;</button>' +

      '<div id="tvRows"><div id="tvRowsIn"></div></div>' +

    '<div id="tvHint"></div>';
  document.body.appendChild(root);
  const pfEl = $('#pf'); if (pfEl) pfEl.tabIndex = -1;      // the remote stays with this page

  const hint = $('#tvHint'); let hintT = null;
  function tvHint(msg, ms){
    hint.textContent = msg; hint.classList.add('show');
    clearTimeout(hintT); hintT = setTimeout(() => hint.classList.remove('show'), ms || 2400);
  }
  setInterval(() => {
    const d = new Date();
    $('#tvClock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  const isPlaying = () => body.classList.contains('playing') || body.classList.contains('iframeMode');
  const watching = () => root.classList.contains('watching');
  const diagEl = document.getElementById('diag');
  const diagOpen = () => diagEl && diagEl.classList.contains('show');

  // ---- browse model: rows of items, a cursor (r, c), a remembered column per row
  let rows = [];            // [{title, els:[...]}]
  let R = 1, C = [1, 0, 0, 0], nowKey = null, nowName = '';
  let cur = null;

  function setFocus(el){
    if (cur) cur.classList.remove('tvf');
    cur = el;
    if (el) el.classList.add('tvf');
    if (el && el._info){
      $('#tvNow').innerHTML = '<b>' + esc(el._info.title) + '</b><span>' + esc(el._info.sub) + '</span>';
      $('#tvGlowA').style.color = el._info.ca;
      $('#tvGlowB').style.color = el._info.cb;
    }
  }
  function place(){
    if (!rows.length) return;
    R = Math.max(0, Math.min(R, rows.length - 1));
    const row = rows[R];
    const c = Math.max(0, Math.min(C[R] || 0, row.els.length - 1));
    C[R] = c;
    setFocus(row.els[c]);
    // keep the focused card in view: strips slide sideways, the rows slide up
    if (row.strip){
      const card = row.els[c];
      const pad = parseFloat(getComputedStyle(row.strip).paddingLeft) || 0;
      const x = Math.max(0, card.offsetLeft + card.offsetWidth + pad * 1.5 - window.innerWidth);
      row.strip.style.transform = 'translateX(' + (-x) + 'px)';
    }
    const inner = $('#tvRowsIn');
    if (R === 0) inner.style.transform = 'translateY(0)';
    else if (row.box){
      const avail = $('#tvRows').clientHeight;
      const need = row.box.offsetTop + row.box.offsetHeight - avail;
      inner.style.transform = 'translateY(' + (-Math.max(0, need)) + 'px)';
    }
  }

  function card(cls, html, act, key){
    const b = document.createElement('div');
    b.className = 'tvcard ' + cls; b.innerHTML = html; b._act = act; b._key = key;
    return b;
  }

  function build(){
    const L = labelFor(curDate || todayISO());
    $('#tvDay').innerHTML = esc(L.head) + '<small>' + esc(L.sub) + '</small>';
    const head = Array.from(root.querySelectorAll('#tvDate .tvbtn'));
    head.forEach(b => b._act = b.getAttribute('data-act'));
    const inner = $('#tvRowsIn'); inner.innerHTML = '';
    const next = [{ title: 'date', els: head }];

    // games: live first, then the ones that open later, finals last
    const gbox = document.createElement('div'); gbox.className = 'tvrow';
    const live = games.filter(g => g.state === 'in').length;
    gbox.innerHTML = '<h2>' + (L.head === 'Today' ? "Today's games" : 'Games · ' + esc(L.head) + ' ' + esc(L.sub)) +
      '<span>' + games.length + (live ? ' · ' + live + ' live' : '') + '</span></h2>';
    const gs = document.createElement('div'); gs.className = 'tvstrip'; gbox.appendChild(gs);
    const gels = [];
    const order = g => g.state === 'in' ? 0 : g.state === 'post' ? 2 : 1;
    games.slice().sort((a, b) => order(a) - order(b)).forEach(g => {
      const parts = String(g.name).split(/\s+(?:vs\.?|@|at)\s+/i);
      const a = team(parts[0]), h = team(parts[1] || '');
      const key = 'g:' + g.name;
      let chip;
      if (key === nowKey) chip = '<span class="tvchip now">WATCHING</span>';
      else if (g.state === 'in') chip = '<span class="tvchip live">LIVE</span>';
      else if (g.state === 'post') chip = '<span class="tvchip">FINAL</span>';
      else if (g.stream === false) chip = '<span class="tvchip">NO FEED YET</span>';
      else chip = '<span class="tvchip">' + esc(g.time || 'later') + '</span>';
      const meta = g.state === 'in' ? 'live now' : g.state === 'post' ? 'game over'
                 : (g.stream === false ? 'check back at kickoff' : 'feed opens at kickoff');
      const tint = 'background:linear-gradient(115deg,' + a.col + '66 0%,#161920f0 42%,#161920f0 58%,' + h.col + '66 100%) !important';
      const el = card('game' + ((g.state === 'post' || g.stream === false) ? ' dim' : ''),
        '<div class="tvmatch">' +
          '<div class="tvside">' + logoHtml(a) + '<div class="tvnick">' + esc(a.nick) + '</div></div>' +
          '<div class="tvvs">' + (parts[1] ? 'VS' : '') + '</div>' +
          (parts[1] ? '<div class="tvside">' + logoHtml(h) + '<div class="tvnick">' + esc(h.nick) + '</div></div>' : '<div class="tvside"></div>') +
        '</div><div class="tvmeta">' + chip + '<span>' + esc(meta) + '</span></div>',
        () => {
          if (g.state === 'post'){ tvHint('That game is over.'); return; }
          if (g.stream === false){ tvHint('No feed listed for this game yet.'); return; }
          startWatching(key, g.name);
          watchGame(g);
        }, key);
      el.setAttribute('style', tint);
      el._info = { title: g.name, sub: ((g.time || '') + (meta ? ' · ' + meta : '')).replace(/^ · /, ''),
                   ca: a.col, cb: h.col };
      wireLogos(el);
      gs.appendChild(el); gels.push(el);
    });
    if (!games.length){
      const nd = (dates || []).filter(d => d > curDate)[0];
      gs.appendChild(card('info', '<div class="t1">No NFL games on this day</div><div class="t2">' +
        (nd ? 'OK: jump to the next game day, ' + esc(nd) : 'use the arrows at the top to change the day') + '</div>',
        () => { if (nd){ curDate = nd; loadGames(); } }, 'empty'));
      gels.push(gs.lastChild);
    }
    inner.appendChild(gbox);
    next.push({ title: 'games', els: gels, strip: gs, box: gbox });

    // channels
    if (channels.length){
      const cbox = document.createElement('div'); cbox.className = 'tvrow';
      cbox.innerHTML = '<h2>NFL TV<span>always on · buffered on this TV</span></h2>';
      const cs = document.createElement('div'); cs.className = 'tvstrip'; cbox.appendChild(cs);
      const cels = [];
      channels.forEach(ch => {
        const key = 'c:' + ch.name;
        const el = card('chan', '<div class="tvlogo">NFL<em>TV</em></div><div class="tvname">' + esc(ch.name) + '</div>' +
          '<div class="tvmeta">' + (key === nowKey ? '<span class="tvchip now">WATCHING</span>' : '<span class="tvchip hd">LIVE</span>') +
          '<span>live channel</span></div>',
          () => { startWatching(key, ch.name); playChannel(ch); }, key);
        el._info = { title: ch.name, sub: 'NFL TV · live 24/7 · buffered locally', ca: '#3ddc84', cb: '#1f7a4c' };
        cs.appendChild(el); cels.push(el);
      });
      inner.appendChild(cbox);
      next.push({ title: 'channels', els: cels, strip: cs, box: cbox });
    }

    // keep the cursor on the same card across rebuilds
    const keyWas = cur && cur._key;
    rows = next;
    if (keyWas){
      rows.forEach((rw, ri) => rw.els.forEach((e, ci) => { if (e._key === keyWas){ R = ri; C[ri] = ci; } }));
    }
    if (!watching() && !diagOpen()) place();
  }

  // ---- the picture must not die on its own
  // Measured on the Fire TV: a live game ran, then the decoder sat on one frame
  // while hls.js kept buffering -- the element thought it was playing, and nothing
  // on screen said otherwise. A TV is left alone for an hour at a time, so it gets
  // a watchdog: a playhead that stops moving is nudged to the live edge, and a
  // second stall soon after is a dead feed and gets rebuilt. Reloading is the one
  // thing a viewer would do with the remote anyway.
  let wdPos = -1, wdStuck = 0, wdLastReload = 0, wdPokes = 0;
  setInterval(function(){
    if (!body.classList.contains('playing') || v.paused || v.seeking){
      wdPos = -1; wdStuck = 0; return;
    }
    const t = v.currentTime;
    if (wdPos >= 0 && Math.abs(t - wdPos) < 0.3){
      wdStuck++;
      if (wdStuck === 1 && Date.now() - wdLastReload > 45000){
        // first stall: snap the playhead forward, which is what "go live" does.
        // 45 s of quiet after a poke: a picture that is merely slow must not be
        // shoved twice in a row, because each shove is a visible scene change.
        wdPokes++;
        wdLastReload = Date.now();
        let moved = false;
        try {
          if (hls && typeof hls.liveSyncPosition === 'number' && isFinite(hls.liveSyncPosition)){
            v.currentTime = hls.liveSyncPosition; moved = true;
          }
        } catch(e){}
        if (!moved){ try { const p = v.play(); if (p && p.catch) p.catch(function(){}); } catch(e){} }
        tvHint('picture stalled - jumping back to live', 2400);
      } else if (wdStuck >= 3 && Date.now() - wdLastReload > 30000){
        // stalled again within a minute: that feed is not coming back by itself
        wdLastReload = Date.now(); wdStuck = 0;
        tvHint('picture stalled - reloading the stream', 2800);
        try {
          if (body.classList.contains('iframeMode')) $('#reloadStream').click();
          else if (lastChannel) playChannel(lastChannel);
          else if (pol.game) watchGame(pol.game);
        } catch(e){}
      }
    } else {
      wdStuck = 0;
    }
    wdPos = t;
  }, 6000);

  // ---- diagnostics on the shell's log, so a stall leaves a trace to read
  let dbgN = 0;
  setInterval(function(){
    if (!body.classList.contains('playing')) return;
    try {
      console.log('tvpos ct=' + v.currentTime.toFixed(1) + ' rs=' + v.readyState +
        ' lat=' + (hls && hls.latency != null ? hls.latency.toFixed(1) : '-') +
        ' pokes=' + wdPokes + ' stalls=' + wdStuck);
    } catch(e){}
    dbgN++;
  }, 20000);

  // ---- watching
  let osdT = null;
  function startWatching(key, name){
    nowKey = key; nowName = name;
    root.classList.add('watching');
    setFocus(null);
    showOsd(false);
    tvHint('starting ' + name + '…', 2600);
    // the picture is the screen: our own fullscreen too, so the app's chrome and
    // the bar stay out of the way on top of the TV layout
    if (!fsActive()) { try { tellAppFullscreen(true); } catch(e){} }
    try { fsUiWake(); } catch(e){}
  }
  function showBrowse(){
    root.classList.remove('watching', 'osd');
    build();
  }
  // stop everything that plays: our player, the game frame, the stream policy
  function tvStop(){
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch(e){}
    const f = $('#pf'); if (f){ f.style.display = 'none'; f.removeAttribute('src'); }
    if (pol.timer){ clearInterval(pol.timer); pol.timer = null; pol.game = null; }
    if (hls){ try { hls.destroy(); } catch(e){} hls = null; }
    body.classList.remove('playing', 'iframeMode');
    setSpin(false);
    hideUnmute();
    lastChannel = null; nowKey = null; nowName = '';
    const nt = $('#nowTitle'); if (nt) nt.textContent = 'nothing playing';
    ['#pillQ','#pillBuf','#pillLat','#pillSrc'].forEach(id => {
      const e = $(id); if (e){ e.style.display = 'none'; e.textContent = '-'; }
    });
    showBrowse();
  }
  function osdButtons(){ return Array.from(root.querySelectorAll('#tvOsdBtns .tvbtn')); }
  let osdC = 0;
  function showOsd(focus){
    root.classList.add('osd');
    refreshOsd();
    if (focus !== false){ osdC = Math.min(osdC, osdButtons().length - 1); setFocus(osdButtons()[osdC]); }
    clearTimeout(osdT);
    osdT = setTimeout(hideOsd, 6000);
  }
  function hideOsd(){ root.classList.remove('osd'); clearTimeout(osdT); if (watching()) setFocus(null); }
  const osdOn = () => root.classList.contains('osd');
  function refreshOsd(){
    $('#tvOsdTitle').textContent = nowName || ($('#nowTitle') ? $('#nowTitle').textContent : '');
    const pills = ['#pillQ', '#pillBuf', '#pillLat', '#pillSrc'].map(id => $(id))
      .filter(e => e && e.style.display !== 'none' && e.textContent.trim() && e.textContent.trim() !== '-');
    $('#tvOsdStat').innerHTML = pills.map(e => '<span class="' + (e.classList.contains('good') ? 'g' : '') + '">' + esc(e.textContent) + '</span>').join('') +
      (body.classList.contains('playing') ? '<span>' + (v.paused ? 'paused' : v.muted ? 'muted' : 'sound on') + '</span>' : '');
    const snd = root.querySelector('[data-osd=snd]');
    if (snd) snd.textContent = v.muted ? 'Sound on' : 'Mute';
    const low = root.querySelector('[data-osd=low]');
    if (low) low.textContent = lowMode ? 'Low delay: on' : 'Low delay: off';
  }
  setInterval(() => { if (osdOn()) refreshOsd(); }, 1000);
  function osdAct(k){
    if (k === 'snd'){ if (v.muted) soundOn(); else soundOff(); }
    else if (k === 'live') seekLive();
    else if (k === 'low') $('#low').click();
    else if (k === 'reload'){ if (body.classList.contains('iframeMode')) $('#reloadStream').click(); else if (lastChannel) playChannel(lastChannel); else tvHint('nothing to reload'); }
    else if (k === 'frozen') $('#freezeBtn').click();
    else if (k === 'stop'){ tvStop(); return; }
    refreshOsd();
    showOsd();
  }

  // ---- keys
  // Two ways in, one body. A Fire TV's WebView does not hand D-pad keys to the
  // page -- it eats them for its own focus traversal, which is why OK did nothing
  // on the first Fire TV run -- so the shell names every key and calls tvKey().
  // window.__nflTvShell is set by the shell when that is the case, and the raw
  // keydown listener below steps aside so nothing moves twice. It still runs for
  // a desktop browser opened with ?tv=1, which is how this screen is tested.
  function remoteKey(k){
    const dir = k === 'up' || k === 'down' || k === 'left' || k === 'right' ? k : null;
    const ok = k === 'ok';
    if (!dir && !ok) return false;
    if (diagOpen()){ if (ok) diagEl.classList.remove('show'); return true; }

    if (watching()){
      if (!osdOn()){
        if (ok && v.muted && body.classList.contains('playing')){ soundOn(); tvHint('sound on', 1200); }
        showOsd();
        return true;
      }
      const bs = osdButtons();
      if (dir === 'left') osdC = Math.max(0, osdC - 1);
      else if (dir === 'right') osdC = Math.min(bs.length - 1, osdC + 1);
      else if (dir === 'up'){ hideOsd(); return true; }
      else if (dir === 'down'){ showOsd(); return true; }
      else if (ok){ osdAct(bs[osdC].getAttribute('data-osd')); return true; }
      showOsd();
      return true;
    }

    if (!rows.length) build();
    if (dir === 'up'){ if (R > 0){ R--; place(); } }
    else if (dir === 'down'){ if (R < rows.length - 1){ R++; place(); } }
    else if (dir === 'left'){ if ((C[R] || 0) > 0){ C[R]--; place(); } }
    else if (dir === 'right'){ if ((C[R] || 0) < rows[R].els.length - 1){ C[R]++; place(); } }
    else if (ok && cur){
      const a = cur._act;
      if (a === 'prev') shiftDay(-1);
      else if (a === 'next') shiftDay(1);
      else if (a === 'today'){ if (curDate !== todayISO()){ curDate = todayISO(); loadGames(); } }
      else if (typeof a === 'function'){
        // the card already playing: just go back to it
        if (cur._key && cur._key === nowKey && isPlaying()){ root.classList.add('watching'); setFocus(null); showOsd(false); return true; }
        a();
      }
    }
    return true;
  }

  addEventListener('keydown', function(ev){
    if (window.__nflTvShell) return;                    // the shell is driving (see above)
    const k = ev.key, kc = ev.keyCode;
    const dir = k === 'ArrowUp' || kc === 19 ? 'up' : k === 'ArrowDown' || kc === 20 ? 'down'
              : k === 'ArrowLeft' || kc === 21 ? 'left' : k === 'ArrowRight' || kc === 22 ? 'right' : null;
    const ok = k === 'Enter' || kc === 13 || kc === 23;
    const back = k === 'Escape' && !IN_APP;          // desktop testing only; the app sends Back itself
    if (!dir && !ok && !back) return;
    ev.preventDefault(); ev.stopPropagation();
    if (back){ window.tvBack(); return; }
    remoteKey(ok ? 'ok' : dir);
  }, true);

  // the list is rebuilt on every refresh / day change: rebuild the cards with it
  const _render = render;
  render = function(){ _render.apply(this, arguments); try { build(); } catch(e){ console.log('tv build: ' + e); } };
  const searchEl = $('#search'); if (searchEl) searchEl.oninput = render;
  if (diagEl) new MutationObserver(function(){
    if (diagOpen()){ setFocus(diagEl.querySelector('.close')); }
    else if (watching()) setFocus(osdOn() ? osdButtons()[osdC] : null);
    else place();
  }).observe(diagEl, { attributes: true, attributeFilter: ['class'] });

  // the shell hands every remote key over by name; 'done' means "the page
  // consumed it" (the <video>s live in here, so the shell must not go looking
  // for another one)
  window.tvKey = function(k){
    if (k === 'menu'){ if (diagOpen()) diagEl.classList.remove('show'); else diag(); return 'done'; }
    // a game that plays in #pf is the site's player, not ours: it has no focus
    // ring, so arrows and OK become clicks on it (tvShot)
    if (body.classList.contains('iframeMode')){
      try { if (window.tvShot) window.tvShot(k); } catch(e){}
      return 'done';
    }
    if (remoteKey(k)) return 'done';
    if (!body.classList.contains('playing')) return null;
    try {
      if (k === 'play' || (k === 'playpause' && v.paused)){ v.muted = false; const p = v.play(); if (p && p.catch) p.catch(() => {}); hideUnmute(); soundState(); tvHint('▶  play', 1000); }
      else if (k === 'pause' || k === 'playpause'){ v.pause(); tvHint('❚❚  paused', 1600); }
      else if (k === 'rewind' || k === 'forward'){
        v.currentTime = Math.max(0, v.currentTime + (k === 'forward' ? 10 : -10));
        tvHint(k === 'forward' ? '10 s »' : '« 10 s', 1000);
      }
    } catch(e){}
    return 'done';
  };
  // Back, asked by the shell: true = handled here, false = leave the app
  window.tvBack = function(){
    if (diagOpen()){ diagEl.classList.remove('show'); return true; }
    if (watching() || isPlaying()){ tvStop(); return true; }
    return false;
  };
  // The whole remote, offered to the shell as one keyed dispatcher: a game opened
  // by the resolver is a page we did not write, and its buttons cannot be reached
  // with a D-pad. The shell hands arrow keys here while a game is showing, and this
  // turns them into real mouse clicks on whatever the page centred.
  window.tvShot = function(k){ return tvShot(k); };
  function tvShot(k){
    const X = function(){
      const out = [];
      document.querySelectorAll('#pf').forEach(function(fr){
        try { out.push.apply(out, fr.contentDocument.querySelectorAll('button,[role=button],a,div,span')); } catch(e){}
      });
      return out;
    };
    const vis = function(el){
      const r = el.getBoundingClientRect();
      return r.width > 30 && r.height > 12 && r.width < window.innerWidth * 0.95;
    };
    const mid = function(el){ const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
    const hit = function(el){
      const m = mid(el);
      try {
        el.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: m.x, clientY: m.y }));
        el.dispatchEvent(new MouseEvent('mouseup',   { bubbles: true, clientX: m.x, clientY: m.y }));
        el.click();
      } catch(e){}
    };
    if (tvShot.count === undefined) tvShot.count = 0;
    const els = X().filter(vis);
    if (!els.length || k === 'ok'){
      // prefer a thing that says play; else the biggest clickable near the middle
      let best = null, bestScore = -1;
      els.forEach(function(el){
        const t = (el.textContent || '').toLowerCase();
        const r = el.getBoundingClientRect();
        let s = 0;
        if (/play|watch|main|live|start/.test(t)) s += 60;
        if (/close|skip|ad|×|subscribe|login/.test(t)) s -= 60;
        s += (1 - Math.abs(mid(el).x - window.innerWidth / 2) / window.innerWidth) * 30;
        s += Math.min(r.width, 300) / 20;
        if (s > bestScore){ bestScore = s; best = el; }
      });
      if (best){ hit(best); tvHint('clicked it', 1200); return 'done'; }
      tvShot.count++;
      const fr = document.querySelector('#pf');
      if (fr){ try { fr.focus(); } catch(e){} }
      tvHint('the player has it - try OK / arrows again', 2000);
      return 'done';
    }
    return null;
  }
  // A game page cannot lay out at 0x0. On a TV the WebView's viewport is 960x540
  // CSS px, and some player wrappers size themselves off the body instead of the
  // viewport: the player iframe measured 0x0 and the picture had no box to paint
  // in (first measured on a Fire TV Stick 4K).
  function sizeTheDocument(){
    try {
      document.documentElement.style.cssText += ';width:100vw !important;height:100vh !important;margin:0;';
      document.body.style.cssText += ';margin:0 !important;width:100vw !important;min-height:100vh !important;';
    } catch(e){}
  }
  sizeTheDocument();
  window.addEventListener('DOMContentLoaded', sizeTheDocument);
  window.addEventListener('load', sizeTheDocument);
  setInterval(function(){
    const f = document.querySelector('.player-embed-wrap iframe, iframe#pf, body > iframe');
    if (!f) return;
    const r = f.getBoundingClientRect();
    if (r.width < 320 || r.height < 180){
      document.documentElement.style.width = '100vw';
      document.documentElement.style.height = '100vh';
      document.body.style.width = '100vw';
      document.body.style.minHeight = '100vh';
    }
  }, 1500);
  build();
})();

boot();
</script>
</body>
</html>
