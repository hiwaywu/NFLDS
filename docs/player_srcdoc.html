<script>(function(){
var px=function(v){var m=/^([0-9.]+)px$/.exec(v);return m?parseFloat(m[1]):null;};
var pv=function(k){try{return window.parent!==window?window.parent[k]:window[k];}catch(e){return 0;}};
var SHADOW_PADDING=4;
var MIN_SIZE=40;
var send=function(){
var el=document.body.firstElementChild;
if(!el)return;
var cs=window.getComputedStyle(el);
var maxW=px(cs.maxWidth),maxH=px(cs.maxHeight);
var width=maxW!==null?maxW:Math.ceil(el.offsetWidth);
var height=maxH!==null?maxH:Math.ceil(el.offsetHeight);
width=width+SHADOW_PADDING*2;
height=height+SHADOW_PADDING*2;
var vw=pv('innerWidth');
if(vw)width=Math.min(width,vw);
if(width<MIN_SIZE||height<MIN_SIZE)return;
parent.postMessage({sbxH:height>0?height:0,sbxW:width>0?width:0},'*');
};
var init=function(){
send();
var el=document.body.firstElementChild;
if(typeof ResizeObserver!=='undefined'){
var ro=new ResizeObserver(send);
ro.observe(document.body);
if(el){ro.observe(el);}
}
window.addEventListener('load',send);
};
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}
else{init();}
})()</script>

}

.buttonDefault:hover {
    cursor: pointer;
    -webkit-filter: brightness(1.1);
    filter: brightness(1.1);
}

@-webkit-keyframes ctaAppear {
    from {
        opacity: 0;
        visibility: hidden;
    }

    to {
        opacity: 1;
        visibility: visible;
    }
}

@keyframes ctaAppear {
    from {
        opacity: 0;
        visibility: hidden;
    }

    to {
        opacity: 1;
        visibility: visible;
    }
}

@-webkit-keyframes ctaPulse {

    0%,
    100% {
        -webkit-transform: scale(1);
        transform: scale(1);
    }

    50% {
        -webkit-transform: scale(1.06);
        transform: scale(1.06);
    }
}

@keyframes ctaPulse {

    0%,
    100% {
        -webkit-transform: scale(1);
        -ms-transform: scale(1);
        transform: scale(1);
    }

    50% {
        -webkit-transform: scale(1.06);
        -ms-transform: scale(1.06);
        transform: scale(1.06);
    }

const initSoundButton = (button, video) => {
    const buttonEl = typeof button === 'string' ? document.querySelector(button) : button;
    const videoEl = typeof video === 'string' ? document.querySelector(video) : video;
    const iconEl = buttonEl?.querySelector?.('[data-sound-button-icon]');

    if (!buttonEl || !videoEl || !iconEl) return;

    const setIcon = (isMuted) => {
        const src = isMuted ? ICON_MUTED_SRC : ICON_UNMUTED_SRC;
        if (src) iconEl.src = src;
    };

    videoEl.muted = true;
    setIcon(true);

    buttonEl.addEventListener('click', () => {
        videoEl.muted = !videoEl.muted;
        setIcon(videoEl.muted);
    });
};

const videoEl = document.querySelector('video');
initSoundButton('[data-sound-button]', videoEl);
